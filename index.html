<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>摸鱼百景图</title>
<style>
  :root{
    --paper:#F6F1E4; --paper2:#EFE7D4; --wash:#D9D2C2; --ink4:#9C9488;
    --ink3:#6B635A; --ink2:#3E3833; --ink:#211E1A; --red:#B54A33;
    --skin:#EAC9A4; --green:#6C7C63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1100px 520px at 12% -8%, #FFFCF2 0%, rgba(255,252,242,0) 62%),
      radial-gradient(900px 460px at 100% 6%, #EDE4D0 0%, rgba(237,228,208,0) 58%),
      var(--paper);
    color:var(--ink);
    font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
    user-select:none;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
    background-image:radial-gradient(rgba(33,30,26,.05) 1px, transparent 1px);
    background-size:3px 3px;opacity:.75;mix-blend-mode:multiply;
  }
  .screen{position:fixed;inset:0;display:flex;flex-direction:column}
  .hidden{display:none !important}

  /* ============ 灵感墙 ============ */
  #wall{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:center}
  .wall-inner{width:min(1080px,100%);padding:clamp(18px,4vw,48px) clamp(16px,4vw,40px) 40px;margin:auto}
  .wall-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    border-bottom:1px solid rgba(33,30,26,.18);padding-bottom:14px}
  .wall-head h1{margin:0;font-size:clamp(30px,5.4vw,46px);font-weight:400;letter-spacing:clamp(4px,1.6vw,10px)}
  .wall-head .sub{margin:8px 0 0;font-size:clamp(12px,2.2vw,14px);color:var(--ink3);letter-spacing:3px}
  .wall-head .seal-top{width:clamp(44px,7vw,60px);height:auto;flex:0 0 auto}
  .posts{display:grid;grid-template-columns:repeat(4,1fr);column-gap:clamp(10px,2vw,22px);row-gap:clamp(30px,4vw,44px);margin-top:clamp(18px,3.4vw,34px)}
  @media (max-width:820px){ .posts{grid-template-columns:repeat(2,1fr);column-gap:12px;row-gap:36px} }
  .post{position:relative;background:none;border:0;padding:0;cursor:pointer;
    aspect-ratio:2/3;transition:transform .22s ease, filter .22s ease;display:block;width:100%}
  .post svg{width:100%;height:100%;display:block;overflow:visible}
  .post::before{content:"";position:absolute;left:50%;top:-12px;width:1px;height:12px;
    background:var(--ink4);opacity:.55;transform:translateX(-50%)}
  .post.playable:hover{transform:translateY(-5px) rotate(-.6deg)}
  .post.playable:active{transform:translateY(-1px) scale(.985)}
  .post.soon{filter:grayscale(.95);opacity:.52;cursor:default}
  .tag{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
    font-size:11px;letter-spacing:2px;white-space:nowrap;color:var(--ink4)}
  .post.playable .tag{color:var(--red)}
  .stars{position:absolute;right:6px;bottom:8px;font-size:11px;color:var(--red);letter-spacing:1px}
  .wall-hint{margin-top:clamp(34px,6vw,54px);text-align:center;font-size:clamp(11px,2.2vw,13px);
    color:var(--ink3);letter-spacing:2px;line-height:1.9}
  .wall-hint b{color:var(--red);font-weight:400}
  .toast{position:fixed;left:50%;bottom:8%;transform:translate(-50%,14px);opacity:0;
    background:rgba(33,30,26,.9);color:var(--paper);padding:10px 20px;border-radius:2px;
    font-size:13px;letter-spacing:2px;pointer-events:none;transition:.3s;z-index:120}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ============ 关卡 ============ */
  #game{align-items:center;justify-content:center;background:#E9E1CF}
  #stage{
    position:absolute;left:50%;top:50%;width:360px;height:640px;background:var(--paper);
    transform:translate(-50%,-50%);transform-origin:center center;overflow:hidden;
    box-shadow:0 10px 40px rgba(33,30,26,.18);
    touch-action:none;
  }
  .floor{position:absolute;inset:0;background:
    radial-gradient(240px 160px at 50% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
    var(--paper);}
  .aisle{position:absolute;left:126px;top:136px;width:108px;height:410px;
    background:var(--paper2);border-left:1px dashed rgba(33,30,26,.18);border-right:1px dashed rgba(33,30,26,.18)}
  .bosszone{position:absolute;left:0;top:0;width:360px;height:134px;background:#E7DFCC}
  .bosszone::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--ink);opacity:.85}
  .desk{position:absolute;width:112px;height:86px}
  .desk svg{width:100%;height:100%;display:block;overflow:visible}
  .door{position:absolute;left:120px;top:528px;width:120px;height:88px;z-index:2}
  .door svg{width:100%;height:100%;display:block;overflow:visible}
  #boss{position:absolute;left:55px;top:-22px;width:250px;height:156px;z-index:5;
    transition:transform .18s ease;transform-origin:50% 80%}
  #ripple{position:absolute;top:64px;width:120px;height:120px;opacity:0;z-index:6;transition:opacity .2s}
  #ripple.show{opacity:.85;animation:rip 1s ease-in-out infinite alternate}
  @keyframes rip{0%{transform:scale(.8);opacity:.55}100%{transform:scale(1.08);opacity:.95}}
  #gaze{position:absolute;top:130px;height:418px;left:122px;width:238px;opacity:0;
    background:linear-gradient(180deg, rgba(33,30,26,.32), rgba(33,30,26,.06) 62%, rgba(33,30,26,0));
    transition:opacity .1s linear;pointer-events:none;z-index:3}
  #gaze.show{opacity:1}
  #player{position:absolute;left:0;top:0;width:46px;height:46px;z-index:8;will-change:transform}
  #player svg{width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 4px 4px rgba(33,30,26,.18))}
  #dangerVig{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
    box-shadow:inset 0 0 70px 26px rgba(33,30,26,.35);transition:opacity .12s}
  #dangerVig.show{opacity:1;animation:vig .5s ease-in-out infinite alternate}
  @keyframes vig{from{opacity:.55}to{opacity:1}}

  .hud{position:absolute;left:10px;right:10px;top:8px;display:flex;align-items:center;
    justify-content:space-between;z-index:20;pointer-events:none}
  .hud button{pointer-events:auto}
  .hud-left{display:flex;align-items:center;gap:8px}
  .back{padding:5px 12px;font-size:12px;border:1px solid rgba(33,30,26,.3);background:rgba(246,241,228,.85);
    color:var(--ink2);border-radius:2px;font-family:inherit;letter-spacing:2px;cursor:pointer}
  .timer{display:flex;align-items:center;gap:6px;background:rgba(246,241,228,.86);
    padding:3px 10px 3px 5px;border-radius:2px;border:1px solid rgba(33,30,26,.16)}
  .timer svg{width:26px;height:26px;display:block}
  .timer span{font-size:14px;letter-spacing:1px;color:var(--ink2);min-width:34px;text-align:right}
  .statetip{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);z-index:12;
    font-size:12px;letter-spacing:2px;color:var(--ink3);white-space:nowrap;
    background:rgba(246,241,228,.78);padding:2px 10px;border-radius:2px}
  .statetip.safe{color:var(--green)}
  .statetip.bad{color:var(--red)}

  .overlay{position:absolute;inset:0;z-index:30;background:rgba(246,241,228,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px;text-align:center;gap:10px}
  .overlay h2{margin:0;font-size:26px;font-weight:400;letter-spacing:5px}
  .overlay p{margin:0;font-size:13px;line-height:2;color:var(--ink3);letter-spacing:.5px}
  .overlay p b{color:var(--red);font-weight:400}
  .overlay .keys{font-size:11.5px;color:var(--ink4);line-height:1.9}
  .ink-btn{margin-top:12px;padding:9px 26px;font-family:inherit;font-size:15px;letter-spacing:3px;
    color:var(--paper);background:var(--ink);border:0;border-radius:3px;cursor:pointer;
    box-shadow:0 2px 0 rgba(33,30,26,.25)}
  .ink-btn:active{transform:translateY(1px)}
  .ink-btn.ghost{background:transparent;color:var(--ink2);border:1px solid rgba(33,30,26,.35);box-shadow:none}
  .btns{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}
  .star-row{display:flex;gap:8px;margin:2px 0 4px}
  .star-row span{font-size:20px;color:var(--d9);color:#D9D2C2;letter-spacing:2px}
  .star-row span.on{color:var(--red)}
  .res-seal{width:64px;height:64px;margin-bottom:4px}
  .splash{position:absolute;inset:0;z-index:29;display:none;align-items:center;justify-content:center}
  .splash svg{width:320px;height:256px;opacity:.9}
  .splash.show{display:flex}
  .endtag{font-size:11px;color:var(--ink4);letter-spacing:2px}

  @media (max-width:420px){
    .post::before{top:-9px;height:9px}
    .tag{bottom:-22px;font-size:10px}
  }
</style>
</head>
<body>

<!-- ================= 灵感墙 ================= -->
<section id="wall" class="screen">
  <div class="wall-inner">
    <div class="wall-head">
      <div>
        <h1>摸鱼百景图</h1>
        <p class="sub">老板的眼里，只有忙人。</p>
      </div>
      <svg class="seal-top" viewBox="0 0 120 120"><use href="#seal"/></svg>
    </div>

    <div class="posts">
      <button class="post playable" data-level="dingban">
        <svg viewBox="0 0 120 180"><use href="#card-unlocked"/></svg>
        <span class="tag">可玩 · 卡点下班</span>
        <span class="stars"></span>
      </button>
      <button class="post soon" data-level="toilet">
        <svg viewBox="0 0 120 180"><use href="#card-toilet"/></svg>
        <span class="tag">敬请期待</span>
      </button>
      <button class="post soon" data-level="drama">
        <svg viewBox="0 0 120 180"><use href="#card-drama"/></svg>
        <span class="tag">敬请期待</span>
      </button>
      <button class="post soon" data-level="overtime">
        <svg viewBox="0 0 120 180"><use href="#card-overtime"/></svg>
        <span class="tag">敬请期待</span>
      </button>
    </div>

    <div class="wall-hint">
      点开<b>「卡点下班」</b>即可试玩 · 其余灵感帖还在绘制中<br>
      老板在上、门在下，左右工位是唯一能藏身的地方
    </div>
  </div>
</section>

<!-- ================= 卡点下班 ================= -->
<section id="game" class="screen hidden">
  <div id="stage">
    <div class="floor"></div>
    <div class="bosszone"></div>
    <div class="aisle"></div>

    <div class="desk" style="left:6px;top:140px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>
    <div class="desk" style="left:242px;top:140px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>
    <div class="desk" style="left:6px;top:252px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>
    <div class="desk" style="left:242px;top:252px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>
    <div class="desk" style="left:6px;top:364px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>
    <div class="desk" style="left:242px;top:364px"><svg viewBox="0 0 170 130"><use href="#desk-top"/></svg></div>

    <div class="door"><svg viewBox="0 0 200 160"><use href="#exit-door"/></svg></div>

    <div id="gaze"></div>
    <svg id="boss" viewBox="0 0 240 150"><use href="#boss-peek"/></svg>
    <svg id="ripple" viewBox="0 0 120 120"><use href="#ripple-ink"/></svg>
    <div id="dangerVig"></div>

    <div id="player"><svg viewBox="0 0 90 90"><use href="#hero-top"/></svg></div>

    <div class="hud">
      <div class="hud-left">
        <button class="back" id="hudBack">返回</button>
      </div>
      <div class="timer">
        <svg viewBox="0 0 120 120"><use href="#clock"/></svg>
        <span id="timeText">35s</span>
      </div>
    </div>

    <div class="statetip" id="stateTip">老板背对，可以走</div>
    <div class="splash" id="splash"><svg viewBox="0 0 200 160"><use href="#splash-ink"/></svg></div>

    <div class="overlay" id="intro">
      <h2>卡点下班</h2>
      <p>18:00 之前摸到门口。<br>老板探头时，只能躲在<b>他不看的那一侧</b>工位。</p>
      <p class="keys">电脑：WASD / 方向键<br>手机：按住屏幕拖动</p>
      <button class="ink-btn" id="startBtn">开始摸鱼</button>
    </div>

    <div class="overlay hidden" id="result">
      <svg class="res-seal" id="resSeal" viewBox="0 0 120 120"><use href="#seal"/></svg>
      <h2 id="resTitle">成功溜走</h2>
      <div class="star-row" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <p id="resMsg"></p>
      <div class="btns">
        <button class="ink-btn" id="retryBtn">再来一次</button>
        <button class="ink-btn ghost" id="backBtn">回灵感墙</button>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast">这帖还没悟出来</div>

<!-- 额外卡片：假装加班 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="card-overtime" viewBox="0 0 120 180">
    <rect x="8" y="8" width="104" height="164" rx="2" fill="#F3EDDD" stroke="#9C9488" stroke-width="1.4"/>
    <rect x="14" y="14" width="92" height="88" fill="#EFE7D4"/>
    <use href="#desk-top" x="16" y="36" width="88" height="68"/>
    <use href="#boss-front" x="62" y="14" width="44" height="56" opacity=".9"/>
    <text x="60" y="124" text-anchor="middle" font-size="17" fill="#211E1A" font-family="STKaiti,KaiTi,serif" letter-spacing="3">假装加班</text>
    <text x="60" y="141" text-anchor="middle" font-size="8.5" fill="#9C9488" font-family="STKaiti,KaiTi,serif">老板在，键盘就不能停</text>
    <rect x="46" y="150" width="28" height="12" fill="none" stroke="#D9D2C2" stroke-dasharray="3 2"/>
  </symbol>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
<defs>
  <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-s" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.07" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wash" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <linearGradient id="coneG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#211E1A" stop-opacity=".5"/>
    <stop offset="1" stop-color="#211E1A" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridP" width="22" height="16" patternUnits="userSpaceOnUse">
    <path d="M22 0v16M0 16h22" fill="none" stroke="#CFC7B7" stroke-width=".8"/>
  </pattern>
</defs>

<!-- ============ 人物 ============ -->
<symbol id="hero-front" viewBox="0 0 120 180">
  <ellipse cx="60" cy="170" rx="30" ry="7" fill="#211E1A" opacity=".12" filter="url(#wash)"/>
  <g filter="url(#rough-s)">
    <rect x="46" y="116" width="12" height="46" rx="6" fill="#3E3833" stroke="#211E1A" stroke-width="2"/>
    <rect x="62" y="116" width="12" height="46" rx="6" fill="#3E3833" stroke="#211E1A" stroke-width="2"/>
    <ellipse cx="51" cy="162" rx="11" ry="5.5" fill="#211E1A"/>
    <ellipse cx="69" cy="162" rx="11" ry="5.5" fill="#211E1A"/>

    <circle cx="86" cy="116" r="6" fill="#EAC9A4" stroke="#211E1A" stroke-width="1.8"/>
    <circle cx="33" cy="47" r="5" fill="#EAC9A4" stroke="#211E1A" stroke-width="1.6"/>

    <path d="M62 56q6 2 12-1" fill="none" stroke="#9C9488" stroke-width="1" opacity=".7"/>
    <ellipse cx="43" cy="55" rx="5" ry="3" fill="#B54A33" opacity=".2"/>
    <ellipse cx="77" cy="55" rx="5" ry="3" fill="#B54A33" opacity=".2"/>
  </g>
</symbol>

<symbol id="hero-top" viewBox="0 0 90 90">
  <ellipse cx="45" cy="80" rx="21" ry="6" fill="#211E1A" opacity=".13" filter="url(#wash)"/>
  <g filter="url(#rough-s)">
    <rect x="17" y="42" width="10" height="28" rx="5" fill="#E9E2D1" stroke="#211E1A" stroke-width="1.8"/>
    <rect x="63" y="42" width="10" height="28" rx="5" fill="#E9E2D1" stroke="#211E1A" stroke-width="1.8"/>
    <circle cx="22" cy="70" r="5" fill="#EAC9A4" stroke="#211E1A" stroke-width="1.5"/>
    <circle cx="68" cy="70" r="5" fill="#EAC9A4" stroke="#211E1A" stroke-width="1.5"/>
    <ellipse cx="45" cy="55" rx="24" ry="18" fill="#E9E2D1" stroke="#211E1A" stroke-width="2.4"/>
    <circle cx="45" cy="39" r="17.5" fill="#211E1A"/>
    <path d="M38 28q7-4 14 0" fill="none" stroke="#6B635A" stroke-width="1.2" opacity=".6"/>
    <ellipse cx="45" cy="53" rx="9" ry="5.5" fill="#EAC9A4"/>
    <path d="M45 48q3 3 0 7" fill="none" stroke="#6B635A" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</symbol>

<symbol id="boss-front" viewBox="0 0 140 180">
  <ellipse cx="70" cy="172" rx="34" ry="7" fill="#211E1A" opacity=".14" filter="url(#wash)"/>
  <g filter="url(#rough-s)">
    <rect x="54" y="122" width="14" height="44" rx="7" fill="#3A3530" stroke="#211E1A" stroke-width="2"/>
    <rect x="72" y="122" width="14" height="44" rx="7" fill="#3A3530" stroke="#211E1A" stroke-width="2"/>
    <ellipse cx="59" cy="166" rx="12" ry="5.5" fill="#211E1A"/>
    <ellipse cx="81" cy="166" rx="12" ry="5.5" fill="#211E1A"/>
    <rect x="63" y="60" width="14" height="16" fill="#E4C09B"/>
    <path d="M30 84q0-22 40-22t40 22l4 34q1 12-8 12H34q-9 0-8-12z" fill="#3A3530" stroke="#211E1A" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M40 102q30-9 60 0" fill="none" stroke="#6B635A" stroke-width="1.4" opacity=".5"/>
    <path d="M60 63l10 26 10-26" fill="#F1EBDC" stroke="#211E1A" stroke-width="1.6" stroke-linejoin="round"/>

  <rect x="40" y="24" width="6" height="40" fill="#E2D9C4"/>
  <rect x="74" y="24" width="6" height="40" fill="#E2D9C4"/>
  <use href="#hero-top" x="36" y="54" width="32" height="32"/>
  <use href="#exit-door" x="66" y="52" width="32" height="26"/>

  <rect x="8" y="8" width="104" height="164" rx="2" fill="#FBF6E9" stroke="#9C9488" stroke-width="1.4"/>

  <ellipse cx="70" cy="89" rx="9" ry="3" fill="#211E1A" opacity=".35"/>

<symbol id="card-drama" viewBox="0 0 120 180">
  <rect x="8" y="8" width="104" height="164" rx="2" fill="#FBF6E9" stroke="#9C9488" stroke-width="1.4"/>
  <rect x="14" y="14" width="92" height="88" fill="#EFE7D4"/>
  <rect x="26" y="22" width="68" height="58" fill="#F6F1E4" stroke="#211E1A" stroke-width="1.6"/>
  <circle cx="74" cy="38" r="8" fill="#EFE7D4" stroke="#9C9488" stroke-width=".8"/>
  <ellipse cx="52" cy="52" rx="5" ry="6" fill="#211E1A"/>

  <ellipse cx="72" cy="56" rx="4" ry="5" fill="#211E1A" opacity=".8"/>
  <path d="M66 72q1-12 6-12t6 12z" fill="#211E1A" opacity=".8"/>
  <rect x="26" y="66" width="68" height="14" fill="#211E1A" opacity=".75"/>
  <path d="M96 30v70" stroke="#D9D2C2" stroke-width="6" opacity=".5"/>
  <text x="60" y="124" text-anchor="middle" font-size="17" fill="#211E1A" font-family="STKaiti,KaiTi,serif" letter-spacing="3">带薪刷剧</text>
  <text x="60" y="141" text-anchor="middle" font-size="8.5" fill="#9C9488" font-family="STKaiti,KaiTi,serif">影子一进画面，手就停</text>

<script>
(function(){
  "use strict";
  var W=360, H=640, SPEED=135, TIME_LIMIT=35;

  /* ---------- 素材注入后的 DOM ---------- */
  var wall=document.getElementById('wall'), game=document.getElementById('game'),
      stage=document.getElementById('stage'), playerEl=document.getElementById('player'),
      bossEl=document.getElementById('boss'), rippleEl=document.getElementById('ripple'),
      gazeEl=document.getElementById('gaze'), vigEl=document.getElementById('dangerVig'),
      timeText=document.getElementById('timeText'), tipEl=document.getElementById('stateTip'),
      intro=document.getElementById('intro'), result=document.getElementById('result'),
      resTitle=document.getElementById('resTitle'), resMsg=document.getElementById('resMsg'),
      resStars=document.getElementById('resStars'), resSeal=document.getElementById('resSeal'),
      splash=document.getElementById('splash'), toast=document.getElementById('toast');

  /* ---------- 藏身格 ---------- */
  var HIDES=[];
  [140,252,364].forEach(function(y){
    HIDES.push({side:'left', x1:0, x2:124, y1:y, y2:y+92});
    HIDES.push({side:'right', x1:236, x2:360, y1:y, y2:y+92});
  });

  /* ---------- 状态 ---------- */
  var scale=1, running=false, raf=0, lastTs=0;
  var p={x:180,y:176};
  var boss={state:'back',timer:3.2,dir:1,lastDir:0};
  var timeLeft=TIME_LIMIT, dangerT=0;
  var keys={left:false,right:false,up:false,down:false};
  var target=null, pointerId=null;

  /* ---------- 自适应缩放 ---------- */
  function fit(){
    var pad=16;
    var vw=window.innerWidth, vh=window.innerHeight;
    scale=Math.min((vw-pad)/W,(vh-pad)/H);
    scale=Math.max(0.4,Math.min(scale,1.45));
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
    stage.style.left='50%'; stage.style.top='50%';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,120);});
  fit();

  /* ---------- 存档 ---------- */
  function loadSave(){
    try{ return JSON.parse(localStorage.getItem('mybj_save')||'{}'); }catch(e){ return {}; }
  }
  function saveStars(n){
    var s=loadSave(); s.dingban=Math.max(s.dingban||0,n);
    try{ localStorage.setItem('mybj_save',JSON.stringify(s)); }catch(e){}
    paintWall();
  }
  function paintWall(){
    var s=loadSave(), card=document.querySelector('.post[data-level="dingban"]');
    if(!card) return;
    var st=card.querySelector('.stars');
    if(s.dingban){ card.classList.add('done'); st.textContent='★×'+s.dingban; }
    else st.textContent='';
  }
  paintWall();

  /* ---------- 墙交互 ---------- */
  document.querySelectorAll('.post').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(btn.classList.contains('soon')){
        toast.classList.add('show');
        clearTimeout(toast._t);
        toast._t=setTimeout(function(){toast.classList.remove('show');},1300);
        return;
      }
      openGame();
    });
  });

  function openGame(){
    wall.classList.add('hidden');
    game.classList.remove('hidden');
    fit();
    resetRound();
    intro.classList.remove('hidden');
    result.classList.add('hidden');
    running=false;
  }
  function backToWall(){
    running=false;
    cancelAnimationFrame(raf);
    game.classList.add('hidden');
    wall.classList.remove('hidden');
    intro.classList.remove('hidden');
  }
  document.getElementById('hudBack').addEventListener('click',function(e){e.stopPropagation();backToWall();});
  document.getElementById('backBtn').addEventListener('click',function(e){e.stopPropagation();backToWall();});

  /* ---------- 开局 ---------- */
  function resetRound(){
    p.x=180; p.y=176;
    boss.state='back'; boss.timer=0.9; boss.dir=1; boss.lastDir=0;
    timeLeft=TIME_LIMIT; dangerT=0; target=null; keys.left=keys.right=keys.up=keys.down=false;
    gazeEl.classList.remove('show'); rippleEl.classList.remove('show');
    vigEl.classList.remove('show');
    tipEl.className='statetip';
    tipEl.textContent='老板背对，可以走';
    timeText.textContent=Math.ceil(TIME_LIMIT)+'s';
    applyBossVisual();
    render();
  }
  function startRound(){
    intro.classList.add('hidden');
    result.classList.add('hidden');
    splash.classList.remove('show');
    running=true; lastTs=0;
    raf=requestAnimationFrame(tick);
  }
  document.getElementById('startBtn').addEventListener('click',function(e){e.stopPropagation();startRound();});
  document.getElementById('retryBtn').addEventListener('click',function(e){e.stopPropagation();resetRound();startRound();});

  /* ---------- 输入 ---------- */
  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
    if(k==='arrowleft'||k==='a') keys.left=true;
    if(k==='arrowright'||k==='d') keys.right=true;
    if(k==='arrowup'||k==='w') keys.up=true;
    if(k==='arrowdown'||k==='s') keys.down=true;
  });
  window.addEventListener('keyup',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') keys.left=false;
    if(k==='arrowright'||k==='d') keys.right=false;
    if(k==='arrowup'||k==='w') keys.up=false;
    if(k==='arrowdown'||k==='s') keys.down=false;
  });

  function toLocal(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
  }
  stage.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')||e.target.closest('.overlay')) return;
    if(!running) return;
    pointerId=e.pointerId;
    target=toLocal(e);
    try{stage.setPointerCapture(e.pointerId);}catch(err){}
  });
  stage.addEventListener('pointermove',function(e){
    if(pointerId===null||e.pointerId!==pointerId) return;
    target=toLocal(e);
  });
  function endPointer(e){
    if(pointerId!==null&&e.pointerId!==pointerId) return;
    pointerId=null; target=null;
  }
  stage.addEventListener('pointerup',endPointer);
  stage.addEventListener('pointercancel',endPointer);

  /* ---------- 老板 ---------- */
  function setBoss(state){
    boss.state=state;
    if(state==='back') boss.timer=1.35+Math.random()*0.45;
    if(state==='warn'){
      boss.timer=0.9;
      var d=Math.random()<0.5?-1:1;
      if(d===boss.lastDir&&Math.random()<0.65) d=-d;
      boss.dir=d; boss.lastDir=d;
    }
    if(state==='peek') boss.timer=1.45;
    if(state==='recover') boss.timer=0.35;
    applyBossVisual();
  }
  function applyBossVisual(){
    var lean=(boss.state==='warn'||boss.state==='peek')?boss.dir*9:0;
    bossEl.style.transform='translateX('+lean+'px) rotate('+(lean*0.25)+'deg)';
    var lookingRight=boss.dir>0;
    gazeEl.style.left=lookingRight?'122px':'0px';
    gazeEl.style.width='238px';
    rippleEl.style.left=lookingRight?'236px':'4px';
    if(boss.state==='warn') rippleEl.classList.add('show');
    else rippleEl.classList.remove('show');
    gazeEl.classList.toggle('show',boss.state==='peek');
  }

  /* ---------- 判定 ---------- */
  function inSafeSlot(){
    var safeSide=boss.dir>0?'left':'right';
    for(var i=0;i<HIDES.length;i++){
      var h=HIDES[i];
      if(h.side===safeSide&&p.x>h.x1&&p.x<h.x2&&p.y>h.y1&&p.y<h.y2) return true;
    }
    return false;
  }
  function hiddenAnywhere(){
    for(var i=0;i<HIDES.length;i++){
      var h=HIDES[i];
      if(p.x>h.x1&&p.x<h.x2&&p.y>h.y1&&p.y<h.y2) return true;
    }
    return false;
  }

  /* ---------- 循环 ---------- */
  function tick(ts){
    if(!running) return;
    if(!lastTs) lastTs=ts;
    var dt=Math.min((ts-lastTs)/1000,0.05);
    lastTs=ts;
    update(dt);
    if(running) raf=requestAnimationFrame(tick);
  }

  function update(dt){
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; timeText.textContent='0s'; lose('门锁了','18:00 到了，保洁阿姨把门锁上了。'); return; }
    timeText.textContent=Math.ceil(timeLeft)+'s';

    var dx=0,dy=0;
    if(keys.left) dx-=1;
    if(keys.right) dx+=1;
    if(keys.up) dy-=1;
    if(keys.down) dy+=1;
    if(!dx&&!dy&&target){
      var tx=target.x-p.x, ty=target.y-p.y;
      var d=Math.hypot(tx,ty);
      if(d>5){ dx=tx/d; dy=ty/d; }
    }
    var len=Math.hypot(dx,dy);
    if(len>0){
      p.x+=dx/len*SPEED*dt;
      p.y+=dy/len*SPEED*dt;
    }
    p.x=Math.max(16,Math.min(W-16,p.x));
    p.y=Math.max(136,Math.min(H-24,p.y));

    boss.timer-=dt;
    if(boss.timer<=0){
      if(boss.state==='back') setBoss('warn');
      else if(boss.state==='warn') setBoss('peek');
      else if(boss.state==='peek') setBoss('recover');
      else setBoss('back');
    }

    if(boss.state==='peek'&&!inSafeSlot()) dangerT+=dt; else dangerT=0;

    if(p.y>=566){ win(); return; }
    if(dangerT>0.16&&boss.state==='peek'){ lose('被发现了','老板探头：「这么早就走？」'); return; }

    render();
  }

  function render(){
    playerEl.style.transform='translate3d('+(p.x-23)+'px,'+(p.y-23)+'px,0)';

    var exposed=boss.state==='peek'&&!inSafeSlot();
    vigEl.classList.toggle('show',exposed);

    if(boss.state==='peek'){
      if(inSafeSlot()){ tipEl.className='statetip safe'; tipEl.textContent='藏好了，别动'; }
      else { tipEl.className='statetip bad'; tipEl.textContent='暴露了！快躲'; }
    }else if(boss.state==='warn'){
      tipEl.className='statetip bad';
      tipEl.textContent='老板要往'+(boss.dir>0?'右':'左')+'看了';
    }else if(boss.state==='recover'){
      tipEl.className='statetip'; tipEl.textContent='缩回去了…';
    }else{
      tipEl.className='statetip';
      tipEl.textContent=hiddenAnywhere()?'老板背对，可以继续走':'趁现在，往下走';
    }
  }

  /* ---------- 结算 ---------- */
  function win(){
    running=false; cancelAnimationFrame(raf);
    var left=Math.max(0,Math.ceil(timeLeft));
    var stars=left>=20?3:(left>=10?2:1);
    saveStars(stars);
    resTitle.textContent='溜了';
    resMsg.innerHTML='剩余 <b>'+left+'</b> 秒摸到门口。<br>今天的摸鱼，很有分寸。';
    resStars.style.display='flex';
    Array.prototype.forEach.call(resStars.children,function(s,i){ s.className=i<stars?'on':''; });
    resSeal.style.display='block';
    result.classList.remove('hidden');
  }
  function lose(title,msg){
    running=false; cancelAnimationFrame(raf);
    resTitle.textContent=title;
    resMsg.textContent=msg;
    resStars.style.display='none';
    resSeal.style.display='none';
    splash.classList.add('show');
    setTimeout(function(){
      splash.classList.remove('show');
      result.classList.remove('hidden');
    },650);
  }

  /* 直接进入关卡：index.html#dingban 或 #dingban-start */
  if(location.hash.indexOf('dingban')>=0){
    openGame();
    if(location.hash.indexOf('start')>=0) startRound();
  }

  /* 防止页面滚动 */
  document.addEventListener('touchmove',function(e){
    if(!game.classList.contains('hidden')) e.preventDefault();
  },{passive:false});
})();
</script>
